name: qa

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended_fuzz:
        description: Run the extended property corpus
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa
      - run: npm pack --silent
      - run: node scripts/generate-ci-fixture.mjs fixture.sb3
      - run: node scripts/smoke-packed.mjs fixture.sb3
      - run: node dist/cli.js fixture.sb3 -o lossless.sb3 -lossless
      - run: node dist/cli.js fixture.sb3 -o lossy.sb3 -lossy
      - run: node dist/cli.js fixture.sb3 -o no-preserve.sb3 -no-preserve
      - run: node dist/cli.js fixture.sb3 -o lossless-anticheat.sb3 -lossless -anticheat
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat.sb3 -lossy -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat.sb3 -no-preserve -anticheat
      - run: node scripts/assert-release-outputs.mjs fixture.sb3 lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3
      - run: node scripts/hash-outputs.mjs ci-hashes.json lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3
      - run: node scripts/check-golden-hashes.mjs ci-hashes.json qa/goldens/ci-fixture-v5.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.node }}
          path: ci-hashes.json
          if-no-files-found: error
          retention-days: 1

  compare:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hashes-*
          path: artifacts
      - run: node scripts/compare-hashes.mjs artifacts

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/gui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/generate-ci-fixture.mjs fixture.sb3
      - run: node dist/cli.js fixture.sb3 -o lossless.sb3 -lossless
      - run: node dist/cli.js fixture.sb3 -o lossy.sb3 -lossy
      - run: node dist/cli.js fixture.sb3 -o no-preserve.sb3 -no-preserve
      - run: node dist/cli.js fixture.sb3 -o lossless-anticheat.sb3 -lossless -anticheat
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat.sb3 -lossy -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat.sb3 -no-preserve -anticheat
      - run: node scripts/assert-release-outputs.mjs fixture.sb3 lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3
      - run: npm --prefix qa/gui ci --ignore-scripts
      - run: node scripts/gui-smoke.mjs lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3
        env:
          GUI_QA_ROOT: qa/gui

  extended-fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.extended_fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --offline -- vitest run test/property.test.ts test/malformed-property.test.ts
        env:
          SCRATCH_OBFUSCATOR_EXTENDED_FUZZ: '1'
