name: qa

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended_fuzz:
        description: Run the extended property corpus
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: packed CLI / ${{ matrix.os }} / Node ${{ matrix.node }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa
      - run: npm pack --silent
      - run: node scripts/generate-ci-fixture.mjs fixture.sb3
      - run: node scripts/smoke-packed.mjs fixture.sb3
      - run: node dist/cli.js fixture.sb3 -o lossless.sb3 -lossless
      - run: node dist/cli.js fixture.sb3 -o lossy.sb3 -lossy
      - run: node dist/cli.js fixture.sb3 -o no-preserve.sb3 -no-preserve
      - run: node dist/cli.js fixture.sb3 -o lossless-anticheat.sb3 -lossless -anticheat
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat.sb3 -lossy -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat.sb3 -no-preserve -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra.sb3 -no-preserve -anticheat -extra
      - run: node dist/cli.js fixture.sb3 -o lossy-allowsize.sb3 -lossy -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-allowsize.sb3 -no-preserve -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra-allowsize.sb3 -no-preserve -anticheat -extra -allowsize
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat-allowsize.sb3 -lossy -anticheat -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-allowsize.sb3 -no-preserve -anticheat -allowsize
      - run: node dist/cli.js fixture.sb3 -o lossless-antisave.sb3 -lossless -antisave
      - run: node dist/cli.js fixture.sb3 -o lossy-antisave.sb3 -lossy -antisave
      - run: node dist/cli.js fixture.sb3 -o no-preserve-antisave.sb3 -no-preserve -antisave
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra-allowsize-antisave.sb3 -no-preserve -anticheat -extra -allowsize -antisave
      - run: node scripts/assert-release-outputs.mjs fixture.sb3 lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3 no-preserve-anticheat-extra.sb3 lossy-allowsize.sb3 no-preserve-allowsize.sb3 no-preserve-anticheat-extra-allowsize.sb3 lossy-anticheat-allowsize.sb3 no-preserve-anticheat-allowsize.sb3 lossless-antisave.sb3 lossy-antisave.sb3 no-preserve-antisave.sb3 no-preserve-anticheat-extra-allowsize-antisave.sb3
      - run: node scripts/hash-outputs.mjs ci-hashes.json lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3 no-preserve-anticheat-extra.sb3 lossy-allowsize.sb3 no-preserve-allowsize.sb3 no-preserve-anticheat-extra-allowsize.sb3 lossy-anticheat-allowsize.sb3 no-preserve-anticheat-allowsize.sb3 lossless-antisave.sb3 lossy-antisave.sb3 no-preserve-antisave.sb3 no-preserve-anticheat-extra-allowsize-antisave.sb3
      - run: node scripts/check-golden-hashes.mjs ci-hashes.json qa/goldens/ci-fixture-v7.json
      - run: node scripts/hash-outputs.mjs platform-hashes.json lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3 no-preserve-anticheat-extra.sb3 lossy-allowsize.sb3 no-preserve-allowsize.sb3 no-preserve-anticheat-extra-allowsize.sb3 lossy-anticheat-allowsize.sb3 no-preserve-anticheat-allowsize.sb3 lossless-antisave.sb3 lossy-antisave.sb3 no-preserve-antisave.sb3 no-preserve-anticheat-extra-allowsize-antisave.sb3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hashes-${{ matrix.os }}-${{ matrix.node }}
          path: platform-hashes.json
          if-no-files-found: error
          retention-days: 1

  compare:
    name: compare all six platform/runtime manifests
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download platform manifests
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern "hashes-*" --dir artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/compare-hashes.mjs artifacts

  browser-smoke:
    name: browser load/save/reload
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/gui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/generate-ci-fixture.mjs fixture.sb3
      - run: node dist/cli.js fixture.sb3 -o lossless.sb3 -lossless
      - run: node dist/cli.js fixture.sb3 -o lossy.sb3 -lossy
      - run: node dist/cli.js fixture.sb3 -o no-preserve.sb3 -no-preserve
      - run: node dist/cli.js fixture.sb3 -o lossless-anticheat.sb3 -lossless -anticheat
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat.sb3 -lossy -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat.sb3 -no-preserve -anticheat
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra.sb3 -no-preserve -anticheat -extra
      - run: node dist/cli.js fixture.sb3 -o lossy-allowsize.sb3 -lossy -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-allowsize.sb3 -no-preserve -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra-allowsize.sb3 -no-preserve -anticheat -extra -allowsize
      - run: node dist/cli.js fixture.sb3 -o lossy-anticheat-allowsize.sb3 -lossy -anticheat -allowsize
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-allowsize.sb3 -no-preserve -anticheat -allowsize
      - run: node dist/cli.js fixture.sb3 -o lossless-antisave.sb3 -lossless -antisave
      - run: node dist/cli.js fixture.sb3 -o lossy-antisave.sb3 -lossy -antisave
      - run: node dist/cli.js fixture.sb3 -o no-preserve-antisave.sb3 -no-preserve -antisave
      - run: node dist/cli.js fixture.sb3 -o no-preserve-anticheat-extra-allowsize-antisave.sb3 -no-preserve -anticheat -extra -allowsize -antisave
      - run: node scripts/assert-release-outputs.mjs fixture.sb3 lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3 no-preserve-anticheat-extra.sb3 lossy-allowsize.sb3 no-preserve-allowsize.sb3 no-preserve-anticheat-extra-allowsize.sb3 lossy-anticheat-allowsize.sb3 no-preserve-anticheat-allowsize.sb3 lossless-antisave.sb3 lossy-antisave.sb3 no-preserve-antisave.sb3 no-preserve-anticheat-extra-allowsize-antisave.sb3
      - run: npm --prefix qa/gui ci --ignore-scripts
      - run: npm --prefix qa/gui run audit
      - run: node scripts/prepare-official-gui.mjs qa/.official-scratch-gui
      - run: node scripts/gui-smoke.mjs lossless.sb3 lossy.sb3 no-preserve.sb3 lossless-anticheat.sb3 lossy-anticheat.sb3 no-preserve-anticheat.sb3 no-preserve-anticheat-extra.sb3 lossy-allowsize.sb3 no-preserve-allowsize.sb3 no-preserve-anticheat-extra-allowsize.sb3 lossy-anticheat-allowsize.sb3 no-preserve-anticheat-allowsize.sb3 lossless-antisave.sb3 lossy-antisave.sb3 no-preserve-antisave.sb3 no-preserve-anticheat-extra-allowsize-antisave.sb3
        env:
          BROWSER_QA_ROOT: qa/gui

  extended-fuzz:
    name: manually requested extended fuzz
    if: github.event_name == 'workflow_dispatch' && inputs.extended_fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec --offline -- vitest run test/property.test.ts test/malformed-property.test.ts
        env:
          SCRATCH_OBFUSCATOR_EXTENDED_FUZZ: '1'
